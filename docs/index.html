<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Notes App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="pad">
      <div class="pad-margin"></div>
      <div class="pad-body">
        <h1>Steno<span>&nbsp;Pad</span></h1>

        <form id="note-form">
          <input type="text" id="note-input" placeholder="Type a note..." required>
          <button type="submit">Add</button>
        </form>

        <ul id="notes-list"></ul>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
