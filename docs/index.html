<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Notes App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="pad">
      <div class="pad-margin"></div>
      <div class="pad-body">
        <h1>Steno<span>&nbsp;Pad</span></h1>

        <!-- AUTH SCREEN: shown when the user is not logged in -->
        <div id="auth-screen">
          <form id="auth-form">
            <input type="email" id="auth-email" placeholder="Email" required>
            <input type="password" id="auth-password" placeholder="Password" required>
            <button type="submit" id="auth-submit-btn">Log In</button>
          </form>
          <p id="auth-error" class="error"></p>
          <p class="toggle-auth">
            <span id="auth-toggle-text">No account?</span>
            <a href="#" id="auth-toggle-link">Sign up</a>
          </p>
        </div>

        <!-- NOTES SCREEN: shown once logged in -->
        <div id="notes-screen" class="hidden">
          <div class="notes-header">
            <span id="user-email"></span>
            <a href="#" id="logout-link">Log out</a>
          </div>

          <form id="note-form">
            <input type="text" id="note-input" placeholder="Type a note..." required>
            <button type="submit">Add</button>
          </form>

          <ul id="notes-list"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
